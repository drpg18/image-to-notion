<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Image → Notion</title>
<style>
body { font-family: system-ui; max-width: 800px; margin: auto; padding: 20px; }
button { width: 100%; padding: 10px; margin-top: 8px; }
textarea { width: 100%; height: 320px; margin-top: 12px; }
</style>
</head>
<body>

<h2>Upload / Paste Images</h2>
<input type="file" id="files" multiple>

<button onclick="autoGen()">Auto Generate (Recommended)</button>

<textarea id="out" placeholder="Output appears here…"></textarea>
<button onclick="copy()">Copy All</button>

<script>
async function autoGen(){
  const fd = new FormData();
  for (let f of document.getElementById("files").files)
    fd.append("files", f);

  const r = await fetch("/auto", { method: "POST", body: fd });
  const j = await r.json();
  document.getElementById("out").value = j.output;
}

function copy(){
  const t = document.getElementById("out");
  t.select();
  document.execCommand("copy");
}
</script>

</body>
</html>
